<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><script src="timeline.js"></script><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,X=document.getElementById('c').getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lin=(t,a,b)=>cl((t-a)/(b-a)),mix=(a,b,p)=>a+(b-a)*p;
const eo3=x=>1-Math.pow(1-x,3),eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const eback=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let TL,IMG={};
const L=document.createElement('canvas');L.width=W;L.height=H;const LC=L.getContext('2d');
const SM=document.createElement('canvas');const SC=SM.getContext('2d');
// per-scene camera: [zoom0, zoom1, x0, x1, y0, y1]  (x,y = focus offset in -1..1 of the free margin)
const CAM=[[1.08,1.22,0,.1,.2,-.1],[1.25,1.1,0,0,1,-1],[1.1,1.25,-.3,.2,0,.2],[1.22,1.08,.3,0,0,0],[1.1,1.3,.4,.2,.8,-.2],[1.25,1.1,-.2,.3,-1,0],
           [1.12,1.25,0,0,.6,-.6],[1.08,1.28,-.2,0,-.2,-.6],[1.25,1.1,0,0,0,0],[1.1,1.25,.2,0,-.3,0],[1.1,1.25,-.4,-.2,0,-.2],[1.3,1.05,0,0,-1,.3]];
const WHIP=new Set([1,4,7,10]); // scene index entered with a whip-pan
function drawScene(c,i,t){
  const s=TL.scenes[i],p=eio(lin(t,s.t0,s.t1)),k=CAM[i];
  const z=mix(k[0],k[1],p),fw=W*z,fh=H*z,mx=(fw-W)/2,my=(fh-H)/2;
  let x=-mx+mix(k[2],k[3],p)*mx,y=-my+mix(k[4],k[5],p)*my;
  // punch on hard cut
  const pz=WHIP.has(i)?0:.06*(1-eo3(lin(t,s.t0,s.t0+.35)));
  c.imageSmoothingEnabled=false;
  c.save();c.translate(W/2,H/2);c.scale(1+pz,1+pz);c.translate(-W/2,-H/2);c.drawImage(IMG[s.img],x,y,fw,fh);c.restore();
}
function sceneAt(t){let i=0;while(i<TL.scenes.length-1&&t>=TL.scenes[i+1].t0)i++;return i}
function frame(t){
  const i=sceneAt(t),s=TL.scenes[i];
  // whip-pan: blur streak around the cut into WHIP scenes (vertical), and before them
  const nxt=TL.scenes[i+1],wIn=WHIP.has(i)?1-lin(t,s.t0,s.t0+.16):0,wOut=nxt&&WHIP.has(i+1)?lin(t,nxt.t0-.16,nxt.t0):0;
  const w=Math.max(wIn,wOut);
  if(w>0.01){
    const dir=wOut>0?-1:1,n=10,amp=w*w*900;
    X.fillStyle='#000';X.fillRect(0,0,W,H);
    for(let k=0;k<n;k++){LC.clearRect(0,0,W,H);const off=dir*amp*(k/(n-1));LC.save();LC.translate(0,off+(wOut>0?-amp*.5:amp*.5));drawScene(LC,i,t);LC.restore();X.globalAlpha=1/(k+1);X.drawImage(L,0,0)}
    X.globalAlpha=1;
  } else drawScene(X,i,t);
  // vignette
  const g=X.createRadialGradient(W/2,H*.48,H*.3,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');X.fillStyle=g;X.fillRect(0,0,W,H);
  stickers(t);nums(t);subtitle(t);
  if(t<.25){X.fillStyle=`rgba(0,0,0,${1-t/.25})`;X.fillRect(0,0,W,H)}
  if(t>TL.total-.4){X.fillStyle=`rgba(0,0,0,${lin(t,TL.total-.4,TL.total)})`;X.fillRect(0,0,W,H)}
}
function outlineText(txt,x,y,size,fill='#fff',stroke=16){
  X.font=`900 ${size}px "Inter Display"`;X.textAlign='center';X.textBaseline='middle';X.lineJoin='round';
  X.lineWidth=stroke;X.strokeStyle='#120d0a';X.strokeText(txt,x,y);
  X.shadowColor='rgba(0,0,0,.6)';X.shadowOffsetY=6;X.shadowBlur=0;X.fillStyle=fill;X.fillText(txt,x,y);X.shadowColor='transparent';X.shadowOffsetY=0;
}
function subtitle(t){
  const w=TL.words.find(w=>t>=w.t0&&t<w.t1+.06);if(!w)return;
  const p=lin(t,w.t0,w.t0+.09),s=mix(1.28,1,eo3(p));
  X.save();X.translate(W/2,H*.56);X.scale(s,s);outlineText(w.w,0,0,w.w.length>11?76:88);X.restore();
}
function stickers(t){
  TL.stickers.forEach(st=>{
    const a=t-st.t;if(a<0||a>1.7)return;const im=IMG['sk_'+st.k];
    const out=lin(a,1.4,1.7),sc=eback(lin(a,0,.3))*(1-out*.3),wob=Math.sin(a*7)*.06;
    const h=430,w=im.width/im.height*h;
    // pixel "assemble" reveal: start very blocky
    const res=Math.max(6,Math.floor(mix(6,w,eo3(lin(a,0,.45)))));
    SM.width=res;SM.height=Math.round(res*h/w);SC.imageSmoothingEnabled=false;SC.drawImage(im,0,0,SM.width,SM.height);
    X.save();X.globalAlpha=1-out;X.translate(W/2+150,H*.25+Math.sin(a*3)*10);X.rotate(wob);X.scale(sc,sc);
    X.shadowColor=`rgba(255,226,58,${.5+.4*Math.sin(a*12)})`;X.shadowBlur=40;X.imageSmoothingEnabled=false;
    X.drawImage(SM,-w/2,-h/2,w,h);X.restore();
  });
}
function nums(t){
  TL.nums.forEach(n=>{const a=t-n.t;if(a<0||a>1.25)return;const out=lin(a,1.0,1.25),s=eback(lin(a,0,.28));
    X.save();X.globalAlpha=1-out;X.translate(W*.32,H*.2);X.rotate(-.05);X.scale(s,s);outlineText(n.txt,0,0,130,'#ffe23a',22);X.restore()});
}
window.render=frame;
window.ready=Promise.resolve(window.TLDATA).then(j=>{TL=j;window.TOTAL=j.total;
  const keys=j.scenes.map(s=>s.img).concat(['sk_angel','sk_money','sk_medal','sk_mug']);
  return Promise.all(keys.map(k=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.src='img/'+k+'.png'})))}).then(()=>document.fonts.load('900 80px "Inter Display"')).then(()=>{frame(0);return true});
</script></body></html>
